<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Домашняя страница</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="src/output.css" rel="stylesheet">
</head>

<body>
  <header class="flex items-center bg-white">

    <nav class="flex w-full items-center justify-between">
      <a href="#info" class="text-sm md:text-base lg:text-lg flex flex-1 items-center justify-center text-gray-600 hover:text-white hover:bg-blue-600 transition-colors h-12">Инфо</a>
      <a href="#skills" class="text-sm md:text-base lg:text-lg flex flex-1 items-center justify-center text-gray-600 hover:text-white hover:bg-blue-600 transition-colors h-12">Навыки</a>
      <a href="#interests" class="text-sm md:text-base lg:text-lg flex flex-1 items-center justify-center text-gray-600 hover:text-white hover:bg-blue-600 transition-colors h-12">Проекты</a>
      <a href="#contacts" class="text-sm md:text-base lg:text-lg flex flex-1 items-center justify-center text-gray-600 hover:text-white hover:bg-blue-600 transition-colors h-12">Ссылки</a>
    </nav>

  </header>

  <section class="bg-gray-100 dark:bg-gray-900">
    <div class="grid max-w-screen-xl px-4 pt-10 pb-8 mx-auto lg:gap-8 xl:gap-0 lg:py-16 lg:grid-cols-12 lg:pt-14">
      <div class="place-self-center lg:col-span-7 text-center">
        <h1 class="max-w-2xl mb-4 text-4xl font-extrabold leading-none tracking-tight md:text-5xl xl:text-6xl dark:text-white">Название</h1>
        <p class="max-w-2xl font-light text-gray-500 lg:mb-8 md:text-lg lg:text-xl dark:text-gray-300">Меня зовут Правкин Даниил. Я учусь в СПБГУ на Математико-механическом факультете на 2-ом курсе бакалавриата. Программа обучения: программная инженерия.
        </p>
      </div>
      <div class="flex items-center justify-center lg:col-span-5 mt-8 lg:mt-0">
        <img 
          src="img/avatar.png" 
          alt="photo"
          class="w-48 h-48 md:w-64 md:h-64 lg:w-full lg:h-auto max-w-sm rounded-xl object-cover shadow-lg"
        >
      </div>               
    </div>
  </section>


  <div id="skills">Навыки</div>


  <div id="projects">Проекты</div>


  <div id="interests">Хобби</div>


  <div id="contacts">Ссылки (vk, github, sourcecraft)</div>


  <footer></footer>

</body>

</html>
